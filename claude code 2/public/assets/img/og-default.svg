<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#241F1A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle radial glow behind logo -->
  <ellipse cx="600" cy="280" rx="340" ry="260" fill="url(#glow)"/>

  <!-- afag3d isometric mark — centered, scaled up -->
  <g transform="translate(480, 80) scale(2)">
    <!-- outer cube – bottom layer -->
    <polygon points="20,86 60,106 60,118 20,98"  fill="#EA580C"/>
    <polygon points="100,86 60,106 60,118 100,98" fill="#C2410C"/>
    <polygon points="60,66 100,86 60,106 20,86"   fill="#FDBA74" stroke="#9A3412" stroke-width="0.5"/>
    <!-- middle layer -->
    <polygon points="32,74 60,88 60,100 32,86"    fill="#EA580C"/>
    <polygon points="88,74 60,88 60,100 88,86"    fill="#C2410C"/>
    <polygon points="60,60 88,74 60,88 32,74"     fill="#FDBA74" stroke="#9A3412" stroke-width="0.5"/>
    <!-- top layer -->
    <polygon points="44,62 60,70 60,82 44,74"     fill="#EA580C"/>
    <polygon points="76,62 60,70 60,82 76,74"     fill="#C2410C"/>
    <!-- molten top face -->
    <polygon points="60,54 76,62 60,70 44,62"     fill="#FFEDD5" stroke="#9A3412" stroke-width="0.5"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="420"
        font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif"
        font-size="86"
        font-weight="700"
        fill="#F5F0EB"
        text-anchor="middle"
        letter-spacing="-2">afag<tspan fill="#EA580C">3d</tspan></text>

  <!-- Subtitle in Persian -->
  <text x="600" y="488"
        font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif"
        font-size="30"
        font-weight="400"
        fill="#9A8A7A"
        text-anchor="middle"
        direction="rtl">استودیوی چاپ سه‌بعدی</text>

  <!-- Orange accent bar at bottom -->
  <rect x="0" y="610" width="1200" height="20" fill="#EA580C" rx="0"/>
  <rect x="0" y="605" width="1200" height="5" fill="#C2410C" opacity="0.6"/>
</svg>
