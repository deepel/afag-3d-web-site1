<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <rect width="600" height="340" fill="#1C1916"/>
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(245,242,236,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="340" fill="url(#grid2)"/>
  <!-- Glow -->
  <radialGradient id="glow2" cx="50%" cy="50%" r="40%">
    <stop offset="0%" stop-color="rgba(234,88,12,0.15)"/>
    <stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <rect width="600" height="340" fill="url(#glow2)"/>
  <!-- Blog icon: lines + pen -->
  <g transform="translate(300,170)">
    <rect x="-70" y="-50" width="140" height="8" rx="4" fill="#241F1A" stroke="#A39A8E" stroke-width="1"/>
    <rect x="-70" y="-32" width="100" height="8" rx="4" fill="#241F1A" stroke="#6B6B6B" stroke-width="1"/>
    <rect x="-70" y="-14" width="120" height="8" rx="4" fill="#241F1A" stroke="#6B6B6B" stroke-width="1"/>
    <rect x="-70" y="4" width="80" height="8" rx="4" fill="#241F1A" stroke="#6B6B6B" stroke-width="1"/>
    <!-- Pen -->
    <g transform="translate(50,-10) rotate(-45)">
      <rect x="-5" y="-30" width="10" height="40" rx="2" fill="none" stroke="#EA580C" stroke-width="1.5"/>
      <polygon points="-5,10 5,10 0,20" fill="#EA580C"/>
      <line x1="-5" y1="-24" x2="5" y2="-24" stroke="#FDBA74" stroke-width="1"/>
    </g>
  </g>
  <text x="300" y="250" text-anchor="middle" fill="#A39A8E" font-size="13" font-family="Tahoma,sans-serif">تصویر مطلب</text>
</svg>
